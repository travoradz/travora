<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعدادات الوكالة | Travora</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f5f7fb;
}

.container{
width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0b3d91;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#0b3d91;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#082b66;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
font-weight:bold;
color:#0b3d91;
}

</style>

</head>

<body>

<div class="container">

<h2>إعدادات الوكالة</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>اسم الوكالة</label>
<input type="text" name="agency_name" value="{{ settings.agency_name }}" required>

<label>رقم الهاتف</label>
<input type="text" name="phone" value="{{ settings.phone }}">

<label>البريد الإلكتروني</label>
<input type="email" name="email" value="{{ settings.email }}">

<label>العنوان</label>
<input type="text" name="address" value="{{ settings.address }}">

<label>المدينة</label>
<input type="text" name="city" value="{{ settings.city }}">

<label>شعار الوكالة</label>
<input type="file" name="logo">

{% if settings.logo %}
<br><br>
<img src="{{ settings.logo.url }}"
width="170"
style="border-radius:10px;border:1px solid #ddd;">
{% endif %}

<button type="submit">
💾 حفظ التغييرات
</button>

<br><br>

<a
href="/change-password/"
style="display:inline-block;background:#16a34a;color:white;padding:12px 20px;border-radius:8px;text-decoration:none;">
🔒 تغيير كلمة المرور
</a>

</form>

<a class="back" href="/dashboard/">
⬅️ الرجوع إلى لوحة التحكم
</a>

</div>

</body>
</html>
