<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة إدارة Travora</title>

<style>
body{
    font-family:Tahoma;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#0b3d91;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
    margin-bottom:15px;
    color:#0b3d91;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:#0b3d91;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.btn:hover{
    background:#082b66;
}
</style>

</head>

<body>

<div class="header">
    <h1>🛡️ لوحة إدارة Travora</h1>
</div>

<div class="container">

    <div class="card">
    <h3>📩 طلبات الاشتراك</h3>
    <a href="{% url 'subscription_requests' %}" class="btn">فتح</a>
</div>

    <div class="card">
    <h3>💬 الرسائل</h3>
    <a href="{% url 'support_messages' %}" class="btn">فتح</a>
</div>
    <div class="card">
    <h3>👥 الوكالات</h3>
    <a href="{% url 'agencies' %}" class="btn">فتح</a>
</div>
    <div class="card">
    <h3>📊 الإحصائيات العامة</h3>
    <a href="{% url 'admin_statistics' %}" class="btn">فتح</a>
</div>

</div>

</body>
</html>
