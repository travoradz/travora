<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>تغيير كلمة المرور</title>

<style>

body{
font-family:Tahoma;
background:#f5f7fb;
}

.box{
max-width:450px;
margin:60px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0b3d91;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#0b3d91;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.success{
color:green;
margin-bottom:15px;
}

.error{
color:red;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="box">

<h2>🔒 تغيير كلمة المرور</h2>

{% if success %}
<p class="success">{{ success }}</p>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="password"
name="current_password"
placeholder="كلمة المرور الحالية"
required>

<input
type="password"
name="new_password"
placeholder="كلمة المرور الجديدة"
required>

<input
type="password"
name="confirm_password"
placeholder="تأكيد كلمة المرور"
required>

<button type="submit">
حفظ
</button>

</form>

</div>

</body>

</html>
