<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انتهت الفترة المجانية | Travora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    width:550px;
    padding:40px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#dc2626;
    margin-bottom:20px;
}

p{
    color:#555;
    font-size:18px;
    line-height:2;
    margin-bottom:30px;
}

.price{
    background:#eef5ff;
    padding:18px;
    border-radius:12px;
    margin-bottom:25px;
    font-size:20px;
}

.price span{
    display:block;
    font-size:36px;
    color:#0b3d91;
    font-weight:bold;
    margin-top:10px;
}

.btn{
    display:inline-block;
    padding:15px 28px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin:8px;
}

.subscribe{
    background:#0b3d91;
}

.subscribe:hover{
    background:#082b66;
}

.logout{
    background:#dc2626;
}

.logout:hover{
    background:#b91c1c;
}

</style>

</head>

<body>

<div class="box">

<h1>⏳ انتهت الفترة المجانية</h1>

<p>

لقد انتهت مدة التجربة المجانية (14 يوم).

<br><br>

يمكنك الآن تفعيل اشتراكك في Travora
بدفعة واحدة فقط والاستفادة من جميع المزايا مدى الحياة.

</p>

<div class="price">

💎 اشتراك مدى الحياة

<span>

8000 دج

</span>

♾️ تدفع مرة واحدة فقط

</div>

<a href="{% url 'payment' %}" class="btn subscribe">

💳 تفعيل الاشتراك

</a>

<a href="{% url 'logout' %}" class="btn logout">

🚪 تسجيل الخروج

</a>

</div>

</body>
</html>
