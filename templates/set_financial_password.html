<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعداد كلمة السر المالية | Travora</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8fc;
            font-family: Arial, Tahoma, sans-serif;
        }

        .box {
            width: 92%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            color: #1769aa;
            text-align: center;
        }

        p {
            color: #6b7280;
            text-align: center;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7dee8;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🔐 كلمة السر المالية</h1>

    <p>
        أنشئ كلمة سر مستقلة لحماية الأرباح والخسائر
        والمعلومات المالية للوكالة.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>كلمة السر الجديدة</label>
        <input
            type="password"
            name="password"
            minlength="6"
            required
        >

        <label>تأكيد كلمة السر</label>
        <input
            type="password"
            name="confirm_password"
            minlength="6"
            required
        >

        <button type="submit">
            حفظ كلمة السر
        </button>
    </form>
</div>

</body>
</html>
